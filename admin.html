<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Confirmados da Malu</title>
  <link rel="stylesheet" href="assets/css/admin.css" />
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script src="assets/js/firebase-config.js" defer></script>
</head>
<body>
  <div class="container">
    <h1>Acesso de organizador</h1>
    <p>Digite a senha para ver a lista de pessoas que confirmaram presença no convite da Malu.</p>

    <div class="form-row">
      <input id="adminPassword" type="password" placeholder="Senha do organizador" aria-label="Senha do organizador" />
      <button id="unlockButton" type="button">Liberar lista</button>
    </div>

    <div id="message" class="message"></div>

    <div id="confirmedSection" style="display:none;">
      <strong>Pessoas confirmadas:</strong>
      <div id="counter" class="counter">Total: 0</div>
      <div id="confirmedList" class="confirmed-list"></div>
    </div>

    <div class="link-row">
      <a href="index.html">Voltar para o convite</a>
    </div>
  </div>

  <script src="assets/js/admin.js" defer></script>
</body>
</html>
